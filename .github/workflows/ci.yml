name: CASEFLOW checks

on:
  push:
    branches: [staging-auth-integration]
  pull_request:
    branches: [staging-auth-integration]

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
