name: CASEFLOW staging checks

on:
  push:
    branches:
      - staging-auth-integration
  pull_request:
    branches:
      - staging-auth-integration

jobs:
  syntax-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run source-level regression tests
        run: npm test
      - name: Check server JavaScript syntax
        run: npm run check
      - name: Check browser application JavaScript syntax
        run: node --check bundle/app.js
