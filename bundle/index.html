
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11172e" />
  <meta name="description" content="CASEFLOW turns messy situations into clear states, blockers, next actions and evidence-backed case histories." />
  <title>CASEFLOW — Living cases, clearer decisions</title>
  <script src="./anna-tool-ids.js"></script>
  <script src="./app.js" type="module"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #18213d;
      --muted: #75809a;
      --line: #e6e9f3;
      --violet: #6757e8;
      --violet-dark: #5141d1;
      --surface: #fff;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #f5f6fc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 0%, rgba(115,96,255,.15), transparent 34rem),
        radial-gradient(ellipse at 100% 22%, rgba(67,159,255,.10), transparent 30rem),
        #f5f6fc;
      letter-spacing: -.01em;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .app { min-height: 100vh; }

    .topbar {
      position: relative;
      z-index: 2;
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px clamp(20px,5vw,76px);
      color: #fff;
      background: linear-gradient(112deg,#10162d 0%,#1a2147 56%,#342a75 100%);
      border-bottom: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 38px rgba(20,26,61,.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 45px;
      height: 45px;
      flex: 0 0 45px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 15px;
      background: linear-gradient(145deg,#9b8fff,#5d4be0);
      box-shadow: 0 8px 24px rgba(104,84,242,.36);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -.06em;
      color: #fff;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: .14em;
      color: #fff;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #c1c8e4;
      letter-spacing: .01em;
    }

    .runtime-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: #e3e6f7;
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #9aa4bb;
      box-shadow: 0 0 0 4px rgba(255,255,255,.08);
    }

    .main {
      width: min(1320px,100%);
      margin: 0 auto;
      padding: clamp(26px,4vw,54px) clamp(18px,4vw,48px) 44px;
    }

    .hero, #primary-btn { display: none; }
    .main > section:not(#cases-container) { display: none; }

    #cases-container {
      width: 100%;
      min-width: 0;
    }

    #status {
      width: min(1160px,100%);
      margin: 26px auto 0;
      padding: 14px 16px;
      border: 1px solid rgba(225,229,242,.9);
      border-radius: 14px;
      background: rgba(255,255,255,.58);
      color: #858da4;
      font-size: 12px;
      line-height: 1.65;
    }

    /* Premium dashboard generated by app.js */
    body .cf-page {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 0 38px;
      color: var(--ink);
    }

    body .cf-topline {
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 30px;
    }

    body .cf-eyebrow {
      margin: 0 0 10px;
      color: var(--violet);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    body .cf-title {
      margin: 0;
      color: #19213f;
      font-size: clamp(32px,4.3vw,49px);
      font-weight: 850;
      line-height: 1.06;
      letter-spacing: -2px;
    }

    body .cf-subtitle {
      max-width: 690px;
      margin: 13px 0 0;
      color: #707b95;
      font-size: 14px;
      line-height: 1.8;
    }

    body .cf-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid #e0e4f0;
      border-radius: 12px;
      background: #fff;
      color: #35405f;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 3px 9px rgba(29,38,79,.035);
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }

    body .cf-button:hover {
      transform: translateY(-1px);
      border-color: #b8b0ff;
      box-shadow: 0 9px 22px rgba(54,47,128,.10);
    }

    body .cf-button-primary {
      border-color: transparent;
      background: linear-gradient(135deg,#8171ff,#5a48dc);
      color: #fff;
      box-shadow: 0 9px 22px rgba(95,76,222,.28);
    }

    body .cf-button-primary:hover {
      border-color: transparent;
      background: linear-gradient(135deg,#7464f5,#4e3acb);
      box-shadow: 0 12px 27px rgba(95,76,222,.34);
    }

    body .cf-button-danger {
      border-color: #f1d6de;
      background: #fff7f9;
      color: #a13a54;
    }

    body .cf-stats {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 16px;
      margin: 30px 0 40px;
    }

    body .cf-stat {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 0;
      padding: 23px 23px 22px;
      border: 1px solid #e7e9f4;
      border-radius: 20px;
      background: linear-gradient(145deg,rgba(255,255,255,.98),rgba(249,249,255,.94));
      box-shadow: 0 12px 30px rgba(37,45,94,.055);
    }

    body .cf-stat:after {
      position: absolute;
      z-index: -1;
      top: -34px;
      right: -25px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: linear-gradient(135deg,rgba(132,113,255,.14),rgba(107,88,235,.015));
      content: "";
    }

    body .cf-stat-label {
      color: #77819b;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .025em;
    }

    body .cf-stat-number {
      margin-top: 12px;
      color: #24264e;
      font-size: 36px;
      font-weight: 850;
      line-height: 1;
      letter-spacing: -1.5px;
    }

    body .cf-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e7eaf4;
    }

    body .cf-section-heading h2 {
      margin: 0;
      color: #202947;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.45px;
    }

    body .cf-muted {
      color: #858da4;
      font-size: 12px;
      line-height: 1.65;
    }

    body .cf-case-list {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 17px;
    }

    body .cf-card,
    body .cf-list-item,
    body .cf-empty {
      min-width: 0;
      border: 1px solid #e6e9f4;
      border-radius: 17px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 8px 25px rgba(31,40,87,.045);
    }

    body .cf-case-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;
      width: 100%;
      padding: 22px;
      text-align: left;
      color: inherit;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    body .cf-case-card:before {
      position: absolute;
      top: 0;
      left: 22px;
      right: 22px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg,#7969f5,#b6aaff);
      content: "";
    }

    body .cf-case-card:hover {
      transform: translateY(-3px);
      border-color: #c7c0ff;
      box-shadow: 0 17px 35px rgba(51,44,128,.10);
    }

    body .cf-case-card h3 {
      margin: 0;
      color: #202846;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      letter-spacing: -.3px;
      overflow-wrap: anywhere;
    }

    body .cf-state {
      display: inline-flex;
      align-self: flex-start;
      max-width: 100%;
      padding: 6px 10px;
      border: 1px solid #e1dcff;
      border-radius: 999px;
      background: #f0edff;
      color: #5948d5;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .07em;
      overflow-wrap: anywhere;
    }

    body .cf-detail-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 17px;
      margin: 23px 0;
    }

    body .cf-detail-grid .cf-card {
      padding: 23px;
      overflow-wrap: anywhere;
    }

    body .cf-card h3 {
      margin: 0 0 12px;
      color: #747e99;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    body .cf-card p {
      margin: 0;
      color: #2e3858;
      font-size: 14px;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    body .cf-form {
      display: grid;
      gap: 18px;
      margin-top: 27px;
    }

    body .cf-field { display: grid; gap: 8px; }

    body .cf-field label {
      color: #35405e;
      font-size: 13px;
      font-weight: 800;
    }

    body .cf-field input,
    body .cf-field textarea {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      border: 1px solid #dfe4f1;
      border-radius: 13px;
      padding: 14px 15px;
      background: #fff;
      color: #18213d;
      font: inherit;
      font-size: 14px;
      outline: none;
      box-shadow: 0 2px 5px rgba(25,35,75,.02);
      transition: border-color .15s, box-shadow .15s;
    }

    body .cf-field input:focus,
    body .cf-field textarea:focus {
      border-color: #8d80ff;
      box-shadow: 0 0 0 4px rgba(117,102,242,.12);
    }

    body .cf-field textarea {
      min-height: 145px;
      resize: vertical;
      line-height: 1.65;
    }

    body .cf-field .cf-help {
      color: #828ba2;
      font-size: 12px;
      line-height: 1.7;
    }

    body .cf-form-actions,
    body .cf-pending-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 3px;
    }

    body .cf-empty {
      padding: 42px 22px;
      border-style: dashed;
      border-color: #d8dcef;
      text-align: center;
      background: rgba(255,255,255,.72);
    }

    body .cf-empty h3 {
      margin: 0 0 8px;
      color: #252d4c;
      font-size: 17px;
    }

    body .cf-empty p {
      max-width: 470px;
      margin: 0 auto 20px;
      color: #7b849d;
      font-size: 13px;
      line-height: 1.8;
    }

    body .cf-list { display: grid; gap: 12px; }

    body .cf-list-item {
      padding: 17px;
      overflow-wrap: anywhere;
    }

    body .cf-list-item p {
      margin: 7px 0 0;
      color: #35405d;
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    body .cf-list-item .cf-muted { margin-top: 6px; }

    body .cf-divider {
      height: 1px;
      margin: 20px 0;
      background: #e9ebf5;
    }

    body .cf-notice {
      margin: 15px 0;
      padding: 14px 16px;
      border: 1px solid #dfe4ef;
      border-radius: 13px;
      background: #fff;
      font-size: 13px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    body .cf-notice-warning {
      border-color: #f0d8a0;
      background: #fffaf0;
      color: #76551b;
    }

    body .cf-notice-success {
      border-color: #b6e2c8;
      background: #f2fbf6;
      color: #245d3e;
    }

    body .cf-notice-error {
      border-color: #f0c3cb;
      background: #fff5f6;
      color: #8c2d3b;
    }

    body .cf-pending {
      margin-top: 23px;
      padding: 23px;
      border: 1px solid #d9d2ff;
      border-radius: 19px;
      background: linear-gradient(145deg,#fbfaff,#f3f0ff);
      box-shadow: 0 12px 30px rgba(79,65,185,.08);
    }

    body .cf-pending h3 {
      margin: 0 0 13px;
      color: #29274f;
      font-size: 17px;
    }

    body .cf-pending .cf-card {
      margin-top: 11px;
      padding: 16px;
      background: #fff;
    }

    body .cf-history-type {
      color: #6653df;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    body .cf-footer-note {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e7eaf4;
      color: #8991a6;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 720px) {
      .topbar {
        min-height: 72px;
        padding: 12px 18px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .brand-subtitle { font-size: 11px; }

      .runtime-status {
        padding: 8px 10px;
        font-size: 11px;
      }

      .main { padding: 27px 17px 32px; }

      body .cf-topline {
        align-items: flex-start;
        flex-direction: column;
      }

      body .cf-title { font-size: 35px; }

      body .cf-stats {
        grid-template-columns: 1fr;
        gap: 11px;
        margin: 23px 0 31px;
      }

      body .cf-stat { padding: 19px; }
      body .cf-stat-number { font-size: 31px; }

      body .cf-case-list,
      body .cf-detail-grid {
        grid-template-columns: 1fr;
      }

      body .cf-case-card { padding: 20px; }
      body .cf-detail-grid .cf-card { padding: 19px; }
      #status { margin-top: 16px; }
    }

    @media (max-width: 420px) {
      .brand-name {
        font-size: 14px;
        letter-spacing: .1em;
      }

      .runtime-status { gap: 7px; }
      .brand { gap: 9px; }
      body .cf-title { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">CF</div>
        <div>
          <div class="brand-name">CASEFLOW</div>
          <div class="brand-subtitle">Living cases, clearer decisions</div>
        </div>
      </div>
      <div class="runtime-status" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="runtime-label">Connecting to Anna...</span>
      </div>
    </header>

    <main class="main">
      <button id="primary-btn" type="button">+ New Case</button>
      <section>
        <div id="cases-container">
          <div class="cf-empty">
            <h3>Preparing your workspace…</h3>
            <p>Loading your cases and activity.</p>
          </div>
        </div>
      </section>
      <div id="status" class="system-message" role="status">
        Initializing CASEFLOW...
      </div>
    </main>
  </div>
</body>
</html>
