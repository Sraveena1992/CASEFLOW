<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3A0F34"><title>Reset password · CASEFLOW</title>
<style>
:root{color-scheme:light;--ink:#3A0F34;--gold:#EAAA00;--muted:#64788e;--line:#e4dce3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff 0,transparent 35%),linear-gradient(135deg,#f7f2f6,#e8edf1)}.card{width:min(100%,460px);background:#fff;border:1px solid #e9e1e8;border-radius:24px;padding:34px;box-shadow:0 24px 70px #3a0f3412}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;margin-bottom:30px}.brand img{width:38px;height:38px}h1{font-size:30px;letter-spacing:-.04em;line-height:1.15;margin:0 0 12px}p{color:var(--muted);margin:0 0 22px}label{display:block;font-weight:700;font-size:13px;margin:17px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8dbe2;border-radius:11px;font:inherit;color:var(--ink)}input:focus{outline:3px solid #eaaa0035;border-color:var(--gold)}button{width:100%;margin-top:20px;border:0;border-radius:11px;padding:14px;background:var(--ink);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#f8f0f5;color:var(--ink);font-size:14px}.msg.show{display:block}.back{display:block;text-align:center;margin-top:20px;color:var(--ink);font-size:14px;text-decoration:none;font-weight:700}
</style></head><body><main class="card"><a class="brand" href="/" style="color:inherit;text-decoration:none"><img src="/caseflow-logo.svg" alt=""><span>CASEFLOW</span></a><h1 id="heading">Forgot your password?</h1><p id="intro">Enter your account email and we’ll send a one-time reset link if email recovery is configured for your workspace.</p>
<form id="forgot"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@company.com"><button id="submit" type="submit">Send reset link</button></form>
<form id="reset" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required placeholder="At least 12 characters"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required placeholder="Re-enter new password"><button id="resetSubmit" type="submit">Update password</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><a class="back" href="/login.html">← Back to sign in</a></main>
<script>
const msg=document.getElementById('message');function show(t){msg.textContent=t;msg.classList.add('show')}async function csrf(){const r=await fetch('/api/auth/csrf',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error('Could not start a secure request. Refresh and try again.');return (await r.json()).csrfToken}
const token=new URLSearchParams(location.search).get('token');if(token){document.getElementById('heading').textContent='Choose a new password';document.getElementById('intro').textContent='Reset links expire after 30 minutes and can only be used once.';document.getElementById('forgot').hidden=true;document.getElementById('reset').hidden=false}
document.getElementById('forgot').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{const csrfToken=await csrf();const r=await fetch('/api/auth/forgot-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not request a reset link.');show(d.message||'If the account exists, recovery instructions will be sent.')}catch(e){show(e.message||'Request failed. Please try again.')}finally{b.disabled=false}});
document.getElementById('reset').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(p!==confirm){show('Passwords do not match.');return}const b=document.getElementById('resetSubmit');b.disabled=true;try{const csrfToken=await csrf();const r=await fetch('/api/auth/reset-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({token,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Password reset failed.');show(d.message||'Password updated.');document.getElementById('reset').hidden=true}catch(e){show(e.message||'Reset failed. Please request a new link.')}finally{b.disabled=false}});
</script></body></html>
